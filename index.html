<body>
<div class="auth" id="authGate">
  <div class="auth-card">
    <div class="auth-mark"></div>
    <h2>LINK Preview Studio</h2>
    <p>Acceso privado. Usa tu cuenta autorizada. La sesión queda protegida en este navegador mediante cookies HttpOnly.</p>
    <input id="loginEmail" type="email" placeholder="tu@email.com" autocomplete="username">
    <div class="password-wrap"><input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="togglePassword" type="button">Ver</button></div>
    <button id="loginBtn">Entrar</button>
    <p class="auth-msg" id="authMsg"></p>
  </div>
</div>
<div class="app">
<header class="top">
  <div class="brand"><button class="icon" id="collapseBtn" title="Achicar panel">☰</button><div class="mark"></div><div><strong>LINK Preview Studio</strong><small>Sistema operativo de soluciones</small></div></div>
  <div class="top-actions"><span class="status ok health-label" id="healthBadge">Conectado</span><button class="pill" id="logoutBtn">Cerrar sesión</button></div>
</header>
<div class="layout" id="layout">
  <aside>
    <div class="side-top"><div class="side-title"><strong>Workspace</strong><button class="new-btn" id="newBtn">＋ <span>Nuevo</span></button></div><input class="search" id="searchInput" placeholder="Buscar proyectos o creaciones"></div>
    <div class="tree" id="tree"></div>
    <div class="side-bottom"><div class="user"><b id="userRole">Owner</b><span id="userEmail"></span></div><button class="icon" id="sideCollapse" title="Achicar panel">◀</button></div>
  </aside>
  <main class="content" id="content"></main>
</div>
</div>

<div class="modal" id="newModal" hidden><div class="modal-card"><h2>Nueva estructura</h2><label>Tipo</label><select id="newType"><option value="client">Cliente</option><option value="project">Proyecto / carpeta</option></select><label>Nombre</label><input id="newName" placeholder="Nombre"><div id="segmentWrap"><label>Segmento</label><select id="newSegment"><option value="">Sin segmento</option></select></div><div id="clientWrap" hidden><label>Cliente</label><select id="newClient"></select></div><label id="descLabel" hidden>Descripción</label><textarea id="newDescription" hidden placeholder="Problema o alcance general del proyecto"></textarea><div class="modal-actions"><button data-close="newModal">Cancelar</button><button class="primary" id="saveNew">Crear</button></div></div></div>
<div class="modal" id="versionsModal" hidden><div class="modal-card"><h2>Historial de versiones</h2><div id="versionsList"></div><div class="modal-actions"><button data-close="versionsModal">Cerrar</button></div></div></div>
<div class="toast" id="toast"></div>

<script type="module">
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let ws={segments:[],clients:[],profiles:[],projects:[],designs:[],templates:[],requests:[],briefs:[],commitments:[],deliverables:[],integrations:[],references:[],activity:[],stats:{}}, view={type:"home",id:null}, currentDesign=null,currentUpdatedAt="",loadingWorkspace=false,collapsed=localStorage.getItem("link-sidebar-collapsed")==="1";
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200)}
function setCollapsed(v){collapsed=v;$("#layout").classList.toggle("collapsed",v);$("#sideCollapse").textContent=v?"▶":"◀";localStorage.setItem("link-sidebar-collapsed",v?"1":"0")}setCollapsed(collapsed);$("#collapseBtn").onclick=()=>setCollapsed(!collapsed);$("#sideCollapse").onclick=()=>setCollapsed(!collapsed);
async function api(url,opts={}){const r=await fetch(url,{credentials:"same-origin",...opts,headers:{...(opts.body?{"Content-Type":"application/json"}:{}),...(opts.headers||{})}});if(r.status===401){$("#authGate").hidden=false;throw new Error("Sesión expirada")}return r}
async function authorize(){const r=await fetch("/api/auth?op=session",{credentials:"same-origin",cache:"no-store"});if(!r.ok){$("#authGate").hidden=false;return false}const d=await r.json();$("#userEmail").textContent=d.user.email||"";$("#userRole").textContent=d.member.role||"member";$("#authGate").hidden=true;return true}
const savedEmail=localStorage.getItem("link-login-email")||"";if(savedEmail)$("#loginEmail").value=savedEmail;
$("#togglePassword").onclick=()=>{const i=$("#loginPassword"),v=i.type==="text";i.type=v?"password":"text";$("#togglePassword").textContent=v?"Ver":"Ocultar"};
async function login(){const email=$("#loginEmail").value.trim(),password=$("#loginPassword").value;if(!email||!password){$("#authMsg").textContent="Escribe correo y contraseña.";return}$("#loginBtn").disabled=true;$("#loginBtn").textContent="Entrando…";$("#authMsg").textContent="";const r=await fetch("/api/auth?op=login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});const d=await r.json().catch(()=>({}));$("#loginBtn").disabled=false;$("#loginBtn").textContent="Entrar";if(!r.ok){$("#authMsg").textContent=d.error||"No se pudo iniciar sesión.";return}localStorage.setItem("link-login-email",email);$("#authGate").hidden=true;$("#userEmail").textContent=d.user?.email||email;$("#userRole").textContent=d.member?.role||"member";await boot()}
$("#loginBtn").onclick=login;$("#loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("#loginEmail").addEventListener("keydown",e=>{if(e.key==="Enter")$("#loginPassword").focus()});
$("#logoutBtn").onclick=async()=>{await fetch("/api/auth?op=logout",{method:"POST",credentials:"same-origin"});location.reload()};
const clientsProjects=id=>ws.projects.filter(p=>p.client_id===id&&p.status==="active"),designsFor=id=>ws.designs.filter(d=>d.project_id===id),reqFor=id=>ws.requests.filter(r=>r.project_id===id),commFor=id=>ws.commitments.filter(c=>c.project_id===id),delFor=id=>ws.deliverables.filter(d=>d.project_id===id),intFor=id=>ws.integrations.filter(i=>i.project_id===id),briefFor=id=>ws.briefs.find(b=>b.project_id===id),segmentName=id=>ws.segments.find(s=>s.id===id)?.name||"Sin segmento",clientName=id=>ws.clients.find(c=>c.id===id)?.name||"General",profileFor=id=>ws.profiles.find(p=>p.client_id===id);

function renderTree(){const q=$("#searchInput").value.trim().toLowerCase(),tree=$("#tree");tree.innerHTML=`<div class="nav-item ${view.type==="home"?"active":""}" data-view="home"><span class="dot"></span><span class="name">Inicio</span></div><div class="side-label">Clientes / proyectos</div>`;ws.clients.forEach(c=>{const block=document.createElement("div");block.innerHTML=`<div class="client-head"><span class="dot"></span><span class="name">${esc(c.name)}</span></div>`;const nodes=clientsProjects(c.id),root=nodes.find(p=>p.kind==="client_root"),children=nodes.filter(p=>p.kind==="project");const hits=children.filter(p=>!q||p.name.toLowerCase().includes(q)||c.name.toLowerCase().includes(q)||designsFor(p.id).some(d=>d.title.toLowerCase().includes(q)));if(q&&!hits.length&&!c.name.toLowerCase().includes(q)&&!(root&&designsFor(root.id).some(d=>d.title.toLowerCase().includes(q))))return;children.forEach(p=>{const ph=document.createElement("div");ph.className="project-head"+(view.type==="project"&&view.id===p.id?" active":"");ph.dataset.project=p.id;ph.innerHTML=`<span class="dot"></span><span class="name">${esc(p.name)}</span><span class="mini">${esc(p.phase||"")}</span>`;block.appendChild(ph);designsFor(p.id).filter(d=>!q||d.title.toLowerCase().includes(q)).forEach(d=>block.appendChild(designNode(d)))});if(root)designsFor(root.id).filter(d=>!q||d.title.toLowerCase().includes(q)).forEach(d=>block.appendChild(designNode(d)));tree.appendChild(block)});const general=ws.projects.find(p=>p.kind==="inbox"||p.slug==="general");tree.insertAdjacentHTML("beforeend",`<div class="side-label">Sistema</div>${general?`<div class="project-head ${view.type==="project"&&view.id===general.id?"active":""}" data-project="${general.id}"><span class="dot"></span><span class="name">General / Inbox</span><span class="mini">${designsFor(general.id).length}</span></div>`:""}<div class="nav-item ${view.type==="templates"?"active":""}" data-view="templates"><span class="dot"></span><span class="name">Plantillas</span><span class="mini">${ws.templates.length}</span></div><div class="nav-item ${view.type==="references"?"active":""}" data-view="references"><span class="dot"></span><span class="name">Referencias</span><span class="mini">${ws.references.length}</span></div>`);tree.querySelectorAll("[data-view]").forEach(x=>x.onclick=()=>navigate(x.dataset.view));tree.querySelectorAll("[data-project]").forEach(x=>x.onclick=()=>navigate("project",x.dataset.project));tree.querySelectorAll("[data-design]").forEach(x=>x.onclick=()=>navigate("design",x.dataset.design))}

function navigate(type,id=null){view={type,id};const u=new URL(location.href);if(type==="design")u.searchParams.set("design",id);else u.searchParams.delete("design");history.replaceState({},"",u);renderTree();renderView()}
function metric(label,value,small){return`<div class="metric"><span>${esc(label)}</span><b>${value??0}</b><small>${esc(small)}</small></div>`}

function homeHtml(){const open=ws.requests.filter(r=>!["closed","delivered"].includes(r.status)).slice(0,6),projects=ws.projects.filter(p=>p.kind==="project").slice(0,8);return`<section class="page"><div class="eyebrow">LINK / Central de trabajo</div><h1>De conversación a producción.</h1><p class="lead">Cada solicitud queda asociada a un cliente y proyecto, evoluciona mediante creaciones y versiones, y termina en compromisos cumplidos, entregables y conocimiento reutilizable.</p><div class="flow"><span>Conversación</span><i>→</i><span>Solicitud</span><i>→</i><span>Proyecto</span><i>→</i><span>Creación</span><i>→</i><span>Versión</span><i>→</i><span>Entrega</span><i>→</i><span>Evolución</span></div><div class="metrics">${metric("Clientes",ws.stats.clients,"memoria estructurada")}${metric("Proyectos",ws.stats.projects,"activos")}${metric("Solicitudes abiertas",ws.stats.open_requests,"desde ChatGPT")}${metric("Creaciones",ws.stats.creations,"versionadas")}${metric("Compromisos",ws.stats.pending_commitments,"pendientes/en curso")}${metric("Entregables",ws.stats.ready_deliverables,"listos")}</div><div class="grid"><div class="card"><div class="card-head"><strong>Solicitudes recientes</strong><span>trabajo en curso</span></div>${open.length?open.map(r=>`<div class="row clickable" data-project-open="${r.project_id}"><div><b>${esc(r.title)}</b><small>${esc(clientName(r.client_id))} · ${esc(ws.projects.find(p=>p.id===r.project_id)?.name||"")} · prioridad ${esc(r.priority)}</small></div><span class="status ${statusClass(r.status)}">${esc(r.status)}</span></div>`).join(""):`<div class="empty-list">No hay solicitudes abiertas.</div>`}</div><div class="card"><div class="card-head"><strong>Proyectos activos</strong><span>infraestructura</span></div>${projects.length?projects.map(p=>{const ints=intFor(p.id);return`<div class="project-card" data-project-open="${p.id}"><div class="project-top"><div><b>${esc(p.name)}</b><small>${esc(clientName(p.client_id))} · ${esc(segmentName(p.segment_id))}</small></div><span class="status ${statusClass(p.phase)}">${esc(p.phase||"activo")}</span></div><div class="health">${ints.length?ints.slice(0,4).map(i=>`<span class="service"><i class="light" style="background:${i.status==='connected'?'var(--ok)':i.status==='error'?'var(--danger)':'var(--warn)'}"></i>${esc(i.provider)}</span>`).join(""):`<span class="service">Sin conexiones registradas</span>`}</div></div>`}).join(""):`<div class="empty-list">No hay proyectos activos.</div>`}</div></div><div class="split"><div class="card brief"><div class="eyebrow">Filosofía</div><h3>Supabase recuerda. ChatGPT dirige.</h3><p>La conversación organiza el trabajo. Supabase conserva cliente, proyecto, solicitud, versiones, compromisos, entregables, plantillas y referencias.</p></div><div class="card brief"><div class="eyebrow">Biblioteca acumulativa</div><h3>Cada trabajo facilita el siguiente.</h3><p>El ADN del cliente y las creaciones aprobadas se convierten en referencias para automatizar futuros trabajos sin partir desde cero.</p></div></div></section>`}
function projectHtml(id){const p=ws.projects.find(x=>x.id===id);if(!p)return`<div class="page">Proyecto no encontrado.</div>`;const b=briefFor(id),req=reqFor(id),com=commFor(id),del=delFor(id),ints=intFor(id),designs=designsFor(id),acts=ws.activity.filter(a=>a.project_id===id).slice(0,20),profile=profileFor(p.client_id);const done=com.filter(c=>c.status==="done").length;return`<section class="page"><div class="project-hero"><div><div class="eyebrow">${esc(clientName(p.client_id))} / ${esc(segmentName(p.segment_id))}</div><h1>${esc(p.name)}</h1><div class="meta">${req.length} solicitud(es) · ${designs.length} creación(es) · ${done}/${com.length} compromisos cumplidos</div></div><select class="select-mini" id="phaseSelect">${["discovery","proposal","design","review","production","delivery","evolution","closed"].map(x=>`<option ${p.phase===x?"selected":""} value="${x}">${x}</option>`).join("")}</select></div><div class="tabs">${["summary","requests","creations","commitments","deliverables","integrations","history"].map((x,i)=>`<button class="tab ${i===0?"active":""}" data-tab="${x}">${({summary:"Resumen",requests:"Solicitudes",creations:"Creaciones",commitments:"Compromisos",deliverables:"Entregables",integrations:"Conexiones",history:"Historial"})[x]}</button>`).join("")}</div><div class="pane" data-pane="summary"><div class="grid"><div class="card brief"><div class="eyebrow">Problema</div><h3>${esc(b?.problem_statement||p.description||"Sin brief formal todavía.")}</h3><p>${esc(b?.objective||"")}</p><div style="height:14px"></div><div class="eyebrow">Solución</div><h3>${esc(b?.solution_summary||"El proyecto todavía no tiene una solución resumida en Supabase.")}</h3><p>${esc(b?.deliverable_scope||"")}</p></div><div class="card brief"><div class="eyebrow">Compromisos</div>${com.length?com.slice(0,6).map(c=>commitHtml(c)).join(""):`<p>No hay compromisos registrados.</p>`}<p style="margin-top:10px">${done}/${com.length} cumplidos</p></div></div>${profile?`<div class="dna"><div class="card"><b>ADN visual</b><pre>${esc(JSON.stringify(profile.brand_dna||{},null,2))}</pre></div><div class="card"><b>Comunicación</b><pre>${esc(JSON.stringify(profile.communication_rules||{},null,2))}</pre></div><div class="card"><b>Reglas de negocio</b><pre>${esc(JSON.stringify(profile.business_rules||{},null,2))}</pre></div></div>`:""}<div class="card" style="margin-top:11px"><div class="card-head"><strong>Conexiones del proyecto</strong><span>salud del sistema</span></div><div class="brief"><div class="integrations">${ints.length?ints.map(integrationHtml).join(""):`<div class="empty-list">Aún no hay conexiones registradas.</div>`}</div></div></div></div><div class="pane" data-pane="requests" hidden><div class="card"><div class="card-head"><strong>Solicitudes</strong><span>${req.length}</span></div>${req.length?req.map(r=>`<div class="row"><div><b>${esc(r.title)}</b><small>${esc(r.summary||r.problem_statement||"")}</small></div><select class="select-mini request-status" data-request="${r.id}">${["captured","understanding","proposed","designing","review","approved","in_production","delivered","evolving","closed"].map(x=>`<option ${r.status===x?"selected":""} value="${x}">${x}</option>`).join("")}</select></div>`).join(""):`<div class="empty-list">Sin solicitudes.</div>`}</div></div><div class="pane" data-pane="creations" hidden><div class="card"><div class="card-head"><strong>Creaciones y versiones</strong><span>${designs.length}</span></div>${designs.length?designs.map(d=>`<div class="row clickable" data-design-open="${d.id}"><div><b>${esc(d.title)}</b><small>${esc(d.creation_type)} · actualizado ${new Date(d.updated_at).toLocaleString()}</small></div><span class="status ok">v${d.current_version||1}</span></div>`).join(""):`<div class="empty-list">Sin creaciones todavía.</div>`}</div></div><div class="pane" data-pane="commitments" hidden><div class="card brief">${com.length?com.map(c=>commitHtml(c,true)).join(""):`<p>Sin compromisos.</p>`}</div></div><div class="pane" data-pane="deliverables" hidden><div class="card"><div class="card-head"><strong>Entregables</strong><span>${del.length}</span></div>${del.length?del.map(d=>`<div class="row"><div><b>${esc(d.title)}</b><small>${esc(d.deliverable_type)}${safeUrl(d.external_url)?` · <a href="${esc(safeUrl(d.external_url))}" target="_blank" rel="noopener">abrir</a>`:""}</small></div><select class="select-mini deliverable-status" data-deliverable="${d.id}">${["draft","ready","delivered","archived"].map(x=>`<option ${d.status===x?"selected":""} value="${x}">${x}</option>`).join("")}</select></div>`).join(""):`<div class="empty-list">Todavía no hay entregables formales.</div>`}</div></div><div class="pane" data-pane="integrations" hidden><div class="card brief"><div class="integrations">${ints.length?ints.map(integrationHtml).join(""):`<p>Sin integraciones registradas.</p>`}</div></div></div><div class="pane" data-pane="history" hidden><div class="card"><div class="card-head"><strong>Historial</strong><span>últimas acciones</span></div>${acts.length?acts.map(a=>`<div class="activity"><b>${esc(a.action)}</b><span>${esc(a.actor)} · ${new Date(a.created_at).toLocaleString()}</span></div>`).join(""):`<div class="empty-list">Sin actividad registrada.</div>`}</div></div></section>`}
function templatesHtml(){return`<section class="page"><div class="eyebrow">Biblioteca</div><h1>Plantillas</h1><p class="lead">Moldes reutilizables por segmento y tipo de creación. La lógica se enseña desde ChatGPT y queda persistida en Supabase.</p><div class="template-grid">${ws.templates.length?ws.templates.map(t=>`<div class="template-card"><b>${esc(t.name)}</b><span>${esc(segmentName(t.segment_id))} · ${esc(t.creation_type)}</span><span>Salidas: ${esc((t.output_types||[]).join(", "))}</span></div>`).join(""):`<div class="card brief"><h3>Todavía no hay plantillas.</h3><p>Desde ChatGPT puedes registrar el primer molde con la herramienta <b>upsert_template</b>.</p></div>`}</div></section>`}

function designHtml(id){const d=ws.designs.find(x=>x.id===id);if(!d)return`<div class="page">Creación no encontrada.</div>`;const project=ws.projects.find(p=>p.id===d.project_id);return`<section><div class="bar"><div class="title"><strong>${esc(d.title)}</strong><small>${esc(clientName(d.client_id))} · ${esc(project?.name||"General")} · versión ${d.current_version||1}</small></div><div class="tools"><select class="ghost" id="moveSelect"><option value="">Mover…</option>${ws.projects.filter(p=>p.status==="active"&&(p.kind==="project"||p.kind==="client_root"||p.kind==="inbox")).map(p=>`<option value="${p.id}" ${p.id===d.project_id?"disabled":""}>${esc(clientName(p.client_id))} / ${esc(p.name)}</option>`).join("")}</select><button class="device active" data-device="desktop">Desktop</button><button class="device" data-device="tablet">Tablet</button><button class="device" data-device="mobile">Mobile</button><button class="ghost" id="versionsBtn">Versiones</button><button class="ghost" id="referenceBtn">Usar como molde</button><button class="ghost" id="openRaw">Abrir</button><button class="ghost" id="downloadHtml">HTML</button><button class="ghost" id="shareBtn">Compartir</button><button class="ghost primary" id="downloadPdf">PDF</button></div></div><div class="stage"><div class="shell" id="shell"><div class="empty" id="designEmpty"><div><b>Cargando preview…</b><span>Sincronizando la versión activa.</span></div></div><iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups" hidden></iframe></div></div></section>`}

async function showVersions(){const r=await api(`/api/design?op=versions&id=${encodeURIComponent(view.id)}`,{cache:"no-store"});const d=await r.json();const current=ws.designs.find(x=>x.id===view.id)?.current_version||1;$("#versionsList").innerHTML=(d.versions||[]).map(v=>`<div class="version-row"><span class="version-badge">v${v.version_number}</span><div><b>${esc(v.change_summary||"Sin resumen")}</b><small>${esc(v.source)} · ${new Date(v.created_at).toLocaleString()}</small></div>${v.version_number===current?`<span class="status ok">activa</span>`:`<button class="ghost restore-version" data-version="${v.version_number}">Restaurar</button>`}</div>`).join("")||`<div class="empty-list">Sin versiones.</div>`;$("#versionsModal").hidden=false;document.querySelectorAll(".restore-version").forEach(b=>b.onclick=async()=>{if(!confirm(`¿Crear una nueva versión restaurando v${b.dataset.version}?`))return;const rr=await api("/api/design",{method:"POST",body:JSON.stringify({action:"restore_version",design_id:view.id,version_number:Number(b.dataset.version)})});if(rr.ok){$("#versionsModal").hidden=true;toast("Versión restaurada como nueva versión");await loadWorkspace();await loadCurrentDesign(true);renderView()}else toast("No se pudo restaurar")})}

function populateModal(){const seg=$("#newSegment"),cl=$("#newClient");if(seg){seg.innerHTML='<option value="">Sin segmento</option>'+ws.segments.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}if(cl)cl.innerHTML=ws.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}
$("#searchInput").oninput=renderTree;$("#newBtn").onclick=()=>{$("#newModal").hidden=false;$("#newName").focus()};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$("#"+b.dataset.close).hidden=true);$("#newType").onchange=()=>{const project=$("#newType").value==="project";$("#clientWrap").hidden=!project;$("#segmentWrap").hidden=project;$("#descLabel").hidden=!project;$("#newDescription").hidden=!project};$("#newType").dispatchEvent(new Event("change"));$("#saveNew").onclick=async()=>{const type=$("#newType").value,name=$("#newName").value.trim();if(!name)return;const payload=type==="client"?{action:"create_client",name,segment_id:$("#newSegment").value||null}:{action:"create_project",name,client_id:$("#newClient").value||null,description:$("#newDescription").value||null};const r=await api("/api/workspace",{method:"POST",body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok){toast(d.error||"No se pudo crear");return}$("#newModal").hidden=true;$("#newName").value="";$("#newDescription").value="";toast(type==="client"?"Cliente creado":"Proyecto creado");await loadWorkspace();if(d.project?.id)navigate("project",d.project.id)};
async function boot(){await loadWorkspace();const designId=new URLSearchParams(location.search).get("design");if(designId&&ws.designs.some(d=>d.id===designId))view={type:"design",id:designId};renderTree();renderView();setInterval(()=>{if(view.type==="design")loadCurrentDesign()},1400);setInterval(loadWorkspace,12000)}
(async()=>{if(await authorize())boot()})();
</script>
</body>
</html>
