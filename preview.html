<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview · LINK</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block;background:#fff}#msg{font:14px system-ui;padding:24px;color:#666}</style></head><body><div id="msg">Cargando preview…</div><iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups" hidden></iframe><script>const id=new URLSearchParams(location.search).get("id"),frame=document.querySelector("#frame"),msg=document.querySelector("#msg");let stamp="";async function sync(){if(!id){msg.textContent="Falta id.";return}const r=await fetch("/api/design?id="+encodeURIComponent(id),{credentials:"same-origin",cache:"no-store"});if(r.status===401){location.href="/?design="+encodeURIComponent(id);return}if(!r.ok){msg.textContent="No se pudo cargar el diseño.";return}const d=await r.json();document.title=d.title+" · LINK Preview";if(d.updated_at!==stamp){stamp=d.updated_at;frame.srcdoc=d.html;frame.hidden=false;msg.hidden=true}}sync();setInterval(sync,1400);</script></body></html>
